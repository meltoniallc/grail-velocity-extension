<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Grail Velocity</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Grail Velocity</h1>
      <p id="capture-note" role="status">Pages you open. No crawling.</p>
    </header>
    <section class="capture" aria-label="Capture">
      <div class="metrics">
        <p><span class="num" id="today">0</span> today</p>
        <p><span class="num" id="queue">0</span> queued</p>
        <p id="server">Local</p>
      </div>
      <p id="last" class="last">No capture yet</p>
      <div class="switches">
        <label class="switch"><input id="capture-on" type="checkbox" checked /> Capture</label>
        <label class="switch"><input id="site-ebay" type="checkbox" checked /> eBay</label>
        <button type="button" id="pause-1h">Pause 1 hour</button>
        <button type="button" id="options" class="ghost">Options</button>
      </div>
    </section>
    <form id="search">
      <label class="sr" for="q">Quick comp lookup</label>
      <input id="q" type="search" placeholder="Year, set, player" autocomplete="off" />
      <button type="button" id="lookup" class="ghost">Lookup</button>
      <button type="submit">Sold tape</button>
    </form>
    <ul id="suggest" hidden></ul>
    <p class="sec" id="sec">High-conf cuts</p>
    <ul id="cuts"></ul>
    <footer>
      <button type="button" id="read">Scrape this page</button>
      <button type="button" id="panel" class="ghost">Side panel</button>
    </footer>
    <script src="../lib/core.js"></script>
    <script src="../lib/observe.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
