<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Grail Velocity</title>
    <link rel="stylesheet" href="../popup/popup.css" />
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body class="panel">
    <header>
      <p class="kicker">Side panel · cut queue</p>
      <h1>Cut queue</h1>
      <p class="hint">List → Fast-Cash gaps only. Sold tape sets the price — catalog never Applies.</p>
      <p id="desk-status" class="desk-status" data-desk="watching" role="status"></p>
      <p id="last" class="status"></p>
      <div class="roles cut-roles" id="roles" aria-label="Fast-Cash · listed ask" hidden>
        <div class="role tape" data-role="tape">
          <p class="role-kicker">Fast-Cash</p>
          <p class="role-value" id="role-tape">—</p>
        </div>
        <div class="role ask" data-role="ask">
          <p class="role-kicker">Listed ask</p>
          <p class="role-value" id="role-ask">—</p>
        </div>
      </div>
      <p id="meta" class="status muted"></p>
    </header>
    <form id="search">
      <input id="q" type="search" placeholder="Type a card — instant tape" autocomplete="off" />
      <button type="submit">Sold tape</button>
    </form>
    <div class="toolbar">
      <button type="button" id="copy-queue" class="ghost">Copy queue</button>
    </div>
    <ul id="cuts"></ul>
    <script src="../lib/core.js"></script>
    <script src="../lib/overlay.js"></script>
    <script src="../lib/suggest.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
